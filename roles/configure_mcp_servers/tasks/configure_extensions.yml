- name: Set Gemini CLI base command fact
  ansible.builtin.set_fact:
    # NOTE: In pnpm v10+, build scripts of unapproved dependencies are blocked (ERR_PNPM_IGNORED_BUILDS).
    #       Passing --ignore-scripts to dlx ensures @google/gemini-cli runs cleanly without native compilation failures.
    configure_mcp_servers_gemini_base: "{{ configure_mcp_pnpm_executable | default('pnpm') }} dlx --ignore-scripts @google/gemini-cli"

- name: Check for GitHub MCP Personal Access Token
  ansible.builtin.shell: |
    grep -q "GITHUB_MCP_PAT" "{{ configure_mcp_servers_mcp_dot_env_path }}"
  register: configure_mcp_servers_github_pat_check
  failed_when: false
  changed_when: false
  ignore_errors: true

- name: Check if GitHub extension is already installed
  when: configure_mcp_servers_github_pat_check.rc == 0
  ansible.builtin.shell: >-
    {% if is_windows -%}
    {{ configure_mcp_servers_gemini_base }} extensions list 2>&1{%- else -%}
    bash -lc '{{ configure_mcp_servers_gemini_base }} extensions list' 2>&1{%- endif %}
  environment:
    CI: "true"
    GEMINI_API_KEY: "dummy"
    PNPM_HOME: >-
      {% if is_windows -%}{{ ansible_facts['env']['USERPROFILE'] }}\AppData\Local\pnpm{%- endif %}
    PATH: >-
      {% if is_windows -%}
      {{ configure_mcp_win_home_dir.stdout ~ '/AppData/Local/pnpm:' ~ configure_mcp_nodejs_path ~ ':' ~ ansible_facts.env.PATH if configure_mcp_nodejs_path is defined else ansible_facts.env.PATH }}
      {%- else -%}
      {{ configure_mcp_nvm_node_bin ~ ':' ~ ansible_facts.env.PATH if configure_mcp_nvm_node_bin is defined else ansible_facts.env.PATH }}
      {%- endif %}
  register: configure_mcp_servers_extension_list
  changed_when: false
  # noqa command-instead-of-shell yaml[line-length]

- name: Install GitHub MCP Extension
  ansible.builtin.shell: >-
    {% if is_windows -%}
    {{ configure_mcp_servers_gemini_base }} extensions install {{ configure_mcp_servers_mcp_github_extension_repo }} --auto-update 2>&1{%- else -%}
    bash -lc '{{ configure_mcp_servers_gemini_base }} extensions install {{ configure_mcp_servers_mcp_github_extension_repo }} --auto-update' 2>&1{%- endif %}
  environment:
    CI: "true"
    GEMINI_API_KEY: "dummy"
    PNPM_HOME: >-
      {% if is_windows -%}{{ ansible_facts['env']['USERPROFILE'] }}\AppData\Local\pnpm{%- endif %}
    PATH: >-
      {% if is_windows -%}
      {{ configure_mcp_win_home_dir.stdout ~ '/AppData/Local/pnpm:' ~ configure_mcp_nodejs_path ~ ':' ~ ansible_facts.env.PATH if configure_mcp_nodejs_path is defined else ansible_facts.env.PATH }}
      {%- else -%}
      {{ configure_mcp_nvm_node_bin ~ ':' ~ ansible_facts.env.PATH if configure_mcp_nvm_node_bin is defined else ansible_facts.env.PATH }}
      {%- endif %}
  register: configure_mcp_servers_install_result
  changed_when: "'Installing extension' in configure_mcp_servers_install_result.stdout"
  failed_when:
    - configure_mcp_servers_install_result.rc != 0
    - "'already installed' not in configure_mcp_servers_install_result.stdout"
  when:
    - configure_mcp_servers_github_pat_check.rc == 0
    - configure_mcp_servers_extension_list.stdout is defined
    - "'github' not in configure_mcp_servers_extension_list.stdout"
  # noqa command-instead-of-shell yaml[line-length]

- name: Warn if GitHub PAT is missing
  ansible.builtin.debug:
    msg: "Skipping GitHub MCP extension installation. Please add GITHUB_MCP_PAT to {{ configure_mcp_servers_mcp_dot_env_path }}."
  when: configure_mcp_servers_github_pat_check.rc != 0

- name: Register GitHub MCP status for post-flight report
  ansible.builtin.set_fact:
    configure_mcp_servers_github_mcp_pat_status: "{{ 'Present' if configure_mcp_servers_github_pat_check.rc == 0 else 'Missing' }}"
    configure_mcp_servers_github_mcp_install_status: >-
      {{ 'Installed/Configured' if (configure_mcp_servers_github_pat_check.rc == 0) else 'Skipped (Missing PAT)' }}
    configure_mcp_servers_github_mcp_action_needed: >-
      {{ 'None' if configure_mcp_servers_github_pat_check.rc == 0 else 'Add GITHUB_MCP_PAT to ' ~ configure_mcp_servers_mcp_dot_env_path }}
