- name: Install MCP tools (macOS)
  ansible.builtin.include_tasks: macos.yml
  when: is_mac

- name: Install MCP tools (Linux)
  ansible.builtin.include_tasks: linux.yml
  when: is_debian_family

- name: Install MCP tools (Windows)
  ansible.builtin.include_tasks: windows.yml
  when: is_windows

- name: Set pnpm executable path (Linux)
  when: is_debian_family
  block:
    - name: Set pnpm executable path fact (Linux)
      ansible.builtin.set_fact:
        configure_mcp_pnpm_executable: "{{ ansible_facts.env.HOME }}/.local/share/pnpm/pnpm"

    - name: Find NVM Node bin directory (Linux)
      ansible.builtin.shell: |
        find {{ ansible_facts.env.HOME }}/.nvm/versions/node -maxdepth 2 -type d -name "bin" | head -n 1
      register: configure_mcp_nvm_node_bin_raw
      changed_when: false

    - name: Set NVM Node bin fact (Linux)
      ansible.builtin.set_fact:
        configure_mcp_nvm_node_bin: "{{ configure_mcp_nvm_node_bin_raw.stdout | trim }}"

- name: Set pnpm executable path (Windows)
  when: is_windows
  block:
    - name: Get user's home directory path in POSIX format
      ansible.builtin.command:
        cmd: cygpath -u "{{ ansible_facts['env']['USERPROFILE'] }}"
      register: configure_mcp_win_home_dir
      changed_when: false

    - name: Set pnpm and node facts
      ansible.builtin.set_fact:
        # NOTE: pnpm is provided by nvm-windows 2.x through its proxy shim (see install_base_packages).
        #       We use the shim's absolute path rather than 'scoop which', which follows PATH order.
        configure_mcp_pnpm_executable: "{{ configure_mcp_win_home_dir.stdout }}/scoop/persist/nvm/.nodejs/pnpm.exe"
        configure_mcp_nodejs_path: "{{ configure_mcp_win_home_dir.stdout }}/scoop/persist/nvm/nodejs/nodejs"

- name: Configure MCP servers (JSON)
  ansible.builtin.include_tasks: configure_mcp.yml

- name: Configure Gemini Extensions
  ansible.builtin.include_tasks: configure_extensions.yml
