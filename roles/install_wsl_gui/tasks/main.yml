- name: Update and upgrade apt packages
  ansible.builtin.apt:
    update_cache: true
    upgrade: dist
  become: true

- name: Install XFCE, XRDP, Net-tools, and XFCE Terminal
  ansible.builtin.apt:
    name:
      - xfce4
      - xfce4-terminal
      - xrdp
      - net-tools
    state: present
  become: true
  register: install_wsl_gui_packages_result

- name: Set alacritty as the default terminal emulator  # noqa: syntax-check[unknown-module]
  become: true
  community.general.alternatives:
    name: x-terminal-emulator
    path: /usr/local/bin/alacritty
    link: /usr/bin/x-terminal-emulator

- name: Set system-wide XFCE default terminal emulator to alacritty
  become: true
  ansible.builtin.lineinfile:
    path: /etc/xdg/xfce4/helpers.rc
    regexp: "^TerminalEmulator=.*"
    line: "TerminalEmulator=alacritty"
    owner: root
    group: root
    mode: "0644"
    create: true

- name: Ensure user xfce4 configuration directory exists
  ansible.builtin.file:
    path: "{{ ansible_facts.env.HOME }}/.config/xfce4"
    state: directory
    mode: "0755"

- name: Set user XFCE default terminal emulator to alacritty
  ansible.builtin.lineinfile:
    path: "{{ ansible_facts.env.HOME }}/.config/xfce4/helpers.rc"
    regexp: "^TerminalEmulator=.*"
    line: "TerminalEmulator=alacritty"
    mode: "0644"
    create: true

- name: Set user XFCE terminal emulator dismissed flag
  ansible.builtin.lineinfile:
    path: "{{ ansible_facts.env.HOME }}/.config/xfce4/helpers.rc"
    regexp: "^TerminalEmulatorDismissed=.*"
    line: "TerminalEmulatorDismissed=true"
    mode: "0644"
    create: true

- name: Remove IBus to prevent Wayland/X11 conflict
  ansible.builtin.apt:
    name: ibus
    state: absent
  become: true

- name: Allow all users to start an X session
  ansible.builtin.lineinfile:
    path: /etc/X11/Xwrapper.config
    regexp: "^allowed_users=.*"
    line: "allowed_users=anybody"
    owner: root
    group: root
    mode: "0644"
    create: true
  become: true
  register: install_wsl_gui_xwrapper_result

- name: Configure XRDP startup script to fix D-Bus and start XFCE
  ansible.builtin.copy:
    dest: /etc/xrdp/startwm.sh
    mode: "0755"
    owner: root
    group: root
    content: |
      #!/bin/sh

      # Unset stale D-Bus and session variables
      unset DBUS_SESSION_BUS_ADDRESS
      unset XDG_RUNTIME_DIR

      # Set input method to XIM (X Input Method)
      export GTK_IM_MODULE=xim
      export QT_IM_MODULE=xim

      # Source user profile to get all environment settings
      . /etc/profile

      # Use startxfce4, which handles dbus-launch and other session setup
      startxfce4
  become: true
  register: install_wsl_gui_startwm_result

# NOTE: XRDP is only restarted when its packages or configuration changed; previously it was restarted
#       (and reported `changed`) on every run. It is never restarted from inside the XFCE session, because
#       that would end the RDP session running the playbook. A change made from inside XFCE takes effect
#       on the next run outside it (or after `sudo systemctl restart xrdp`).
- name: Restart XRDP service
  ansible.builtin.service:
    name: xrdp
    state: restarted
  become: true
  when:
    - not is_inside_xfce
    - install_wsl_gui_packages_result is changed or install_wsl_gui_xwrapper_result is changed or install_wsl_gui_startwm_result is changed

- name: Ensure XRDP is running and enabled
  ansible.builtin.service:
    name: xrdp
    state: started
    enabled: true
  become: true
