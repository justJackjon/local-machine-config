- name: Install LazyVim
  block:
    - name: Set Windows home directory fact
      when: is_windows
      block:
        - name: Get user's home directory path in POSIX format
          ansible.builtin.command:
            cmd: cygpath -u "{{ ansible_facts['env']['USERPROFILE'] }}"
          register: install_lazyvim_win_home_dir_raw
          changed_when: false

        - name: Set install_lazyvim_win_home_dir fact
          ansible.builtin.set_fact:
            install_lazyvim_win_home_dir: "{{ install_lazyvim_win_home_dir_raw.stdout }}"

    - name: Set OS specific facts
      when: is_windows
      ansible.builtin.set_fact:
        install_lazyvim_minttyrc_file: "{{ install_lazyvim_win_home_dir + '/.minttyrc' if is_windows else '~/.minttyrc' }}"
        install_lazyvim_localappdata_posix: "{{ install_lazyvim_win_home_dir }}/AppData/Local"

    - name: Set general facts
      ansible.builtin.set_fact:
        install_lazyvim_nvim_config_dir: "{{ install_lazyvim_localappdata_posix + '/nvim' if is_windows else '~/.config/nvim' }}"

    - name: Ensure required dependencies are installed
      block:
        - name: Ensure Debian-based system dependencies are installed
          when: is_debian_family
          become: true
          ansible.builtin.apt:
            name: tar
            state: present
            update_cache: true

        - name: Ensure MacOS dependencies are installed
          when: is_mac
          block:
            - name: Check if Homebrew is installed
              ansible.builtin.command: brew -v
              register: install_lazyvim_brew_check
              failed_when: install_lazyvim_brew_check.rc != 0
              changed_when: false

            - name: Fail if Homebrew is not installed
              ansible.builtin.fail:
                msg: "Homebrew is not installed. Please install Homebrew first."
              when: install_lazyvim_brew_check.rc != 0

        - name: Ensure Windows dependencies are installed
          when: is_windows
          block:
            - name: Check if MSYS2 is installed on Windows
              ansible.builtin.stat:
                path: "{{ item }}"
              loop:
                - "/c/msys64/mingw64.exe"
                - "/c/tools/msys64/mingw64.exe"
                - "{{ install_lazyvim_win_home_dir }}/scoop/apps/msys2/current/mingw64.exe"
              register: install_lazyvim_msys2_check

            - name: Fail if MSYS2 is not installed on Windows
              when:
                - >
                  install_lazyvim_msys2_check.results | selectattr('stat.exists', 'equalto', false) | list | length ==
                  install_lazyvim_msys2_check.results | length
              ansible.builtin.fail:
                msg: "MSYS2 is not installed. Please install MSYS2 before running this playbook."

    - name: Install Neovim
      block:
        - name: Install Neovim on Debian-based systems
          when: is_debian_family
          become: true
          block:
            - name: Remove existing neovim package
              ansible.builtin.apt:
                name: neovim
                state: absent

            - name: Set Neovim architecture string
              ansible.builtin.set_fact:
                install_lazyvim_nvim_arch: >-
                  {{ 'x86_64' if ansible_facts.architecture == 'x86_64' else
                     'arm64' if ansible_facts.architecture == 'aarch64' else '' }}

            - name: Fail if architecture is not supported
              ansible.builtin.fail:
                msg: "Unsupported architecture: {{ ansible_facts.architecture }}"
              when: install_lazyvim_nvim_arch == ''

            - name: Set Neovim archive and directory names
              ansible.builtin.set_fact:
                install_lazyvim_nvim_archive_name: "nvim-linux-{{ install_lazyvim_nvim_arch }}.tar.gz"
                install_lazyvim_nvim_dir_name: "nvim-linux-{{ install_lazyvim_nvim_arch }}"

            # NOTE: Neovim is only (re)installed when the installed version differs from the latest
            #       release. Previously every run deleted /opt/nvim-* and re-extracted it, and because the
            #       `latest` archive was cached in /tmp, it never actually upgraded once downloaded.
            # NOTE: "Latest" is the newest release older than the supply-chain cutoff (see the playbook). The
            #       helper skips Neovim's `stable` and `nightly` releases, which aren't version tags.
            - name: Find the newest Neovim release older than the supply-chain cutoff
              ansible.builtin.include_tasks: ../../../common/tasks/resolve_github_release.yml
              vars:
                resolve_github_release_repo: neovim/neovim

            - name: Check installed Neovim version
              ansible.builtin.command:
                argv: ["/opt/{{ install_lazyvim_nvim_dir_name }}/bin/nvim", --version]
              register: install_lazyvim_nvim_installed_version
              changed_when: false
              failed_when: false

            - name: Set whether Neovim needs (re)installing
              ansible.builtin.set_fact:
                install_lazyvim_nvim_version: "{{ resolved_github_release.tag_name }}"
                install_lazyvim_nvim_asset: >-
                  {{ resolved_github_release.assets | selectattr('name', 'equalto', install_lazyvim_nvim_archive_name) | first }}
                install_lazyvim_nvim_needs_install: >-
                  {{ (install_lazyvim_nvim_installed_version.stdout_lines | default([]) | first | default(''))
                     != 'NVIM ' ~ resolved_github_release.tag_name }}

            - name: Download Neovim archive
              when: install_lazyvim_nvim_needs_install
              ansible.builtin.get_url:
                url: "{{ install_lazyvim_nvim_asset.browser_download_url }}"
                dest: "/tmp/{{ install_lazyvim_nvim_archive_name }}"
                checksum: "{{ install_lazyvim_nvim_asset.digest }}"
                mode: "0644"
                force: true

            - name: Remove existing Neovim directory
              when: install_lazyvim_nvim_needs_install
              ansible.builtin.file:
                path: "/opt/{{ install_lazyvim_nvim_dir_name }}"
                state: absent

            - name: Unarchive Neovim
              when: install_lazyvim_nvim_needs_install
              ansible.builtin.unarchive:
                src: "/tmp/{{ install_lazyvim_nvim_archive_name }}"
                dest: /opt
                remote_src: true

            - name: Remove Neovim archive
              when: install_lazyvim_nvim_needs_install
              ansible.builtin.file:
                path: "/tmp/{{ install_lazyvim_nvim_archive_name }}"
                state: absent

            - name: Create symbolic link
              ansible.builtin.file:
                src: "/opt/{{ install_lazyvim_nvim_dir_name }}/bin/nvim"
                dest: /usr/local/bin/nvim
                state: link

        - name: Install Neovim on MacOS
          when: is_mac
          community.general.homebrew:
            name: neovim
            state: present
            update_homebrew: true

    - name: Install neovim providers (Unix)
      when: is_debian_family or is_mac
      block:
        - name: Set pnpm home directory for Unix
          ansible.builtin.set_fact:
            install_lazyvim_pnpm_home_dir: "{{ ansible_facts.env.HOME }}/.local/share/pnpm"

        # NOTE: This role used to delete `$PNPM_HOME/bin/pnpm` as a "circular shim" (a pnpm 10-era
        #       workaround). From pnpm 11 that file is pnpm's real launcher, so deleting it removed pnpm.
        #       The executable is now resolved instead (see common/tasks/resolve_pnpm_executable.yml).
        # NOTE: nvm's default Node.js, not the first directory `find` lists: several versions are installed
        #       once install_base_packages upgrades Node.js (see common/tasks/install_node_lts_nvm_sh.yml).
        - name: Find NVM Node bin directory (Unix)
          ansible.builtin.shell: source "$HOME/.nvm/nvm.sh" && dirname "$(nvm which default)"
          args:
            executable: /bin/bash
          register: install_lazyvim_nvm_node_bin_raw
          changed_when: false
          failed_when: false

        - name: Set NVM Node bin fact (Unix)
          ansible.builtin.set_fact:
            install_lazyvim_node_bin_dir: "{{ install_lazyvim_nvm_node_bin_raw.stdout | trim if install_lazyvim_nvm_node_bin_raw.rc == 0 else '' }}"

        - name: Install pynvim for Python provider (Debian)
          when: is_debian_family
          become: true
          # NOTE: python3-pynvim *recommends* the apt `neovim` package. Installing recommends pulled it in,
          #       and the "Remove existing neovim package" task removed it again on the next run.
          ansible.builtin.apt:
            name: python3-pynvim
            state: latest
            install_recommends: false

        - name: Install pynvim for Python provider (Mac)
          when: is_mac
          ansible.builtin.pip:
            name: pynvim
            state: latest

        - name: Find the pnpm executable (Unix)
          ansible.builtin.include_tasks: ../../../common/tasks/resolve_pnpm_executable.yml
          vars:
            resolve_pnpm_node_bin_dir: "{{ install_lazyvim_node_bin_dir }}"

        - name: Fail if no working pnpm was found (Unix)
          ansible.builtin.assert:
            that: resolved_pnpm_executable_path | length > 0
            fail_msg: No working pnpm found; it is installed by the install_base_packages role.
            quiet: true

        - name: Install neovim for Node.js provider (Unix)
          ansible.builtin.include_tasks: ../../../common/tasks/install_pnpm_global_packages.yml
          vars:
            pnpm_global_executable: "{{ resolved_pnpm_executable_path }}"
            pnpm_global_environment:
              PNPM_HOME: "{{ install_lazyvim_pnpm_home_dir }}"
              PATH: "{{ install_lazyvim_pnpm_home_dir }}/bin:{{ install_lazyvim_pnpm_home_dir }}:{{ install_lazyvim_node_bin_dir | default('') }}:{{ ansible_facts.env.PATH }}"
            pnpm_global_packages:
              - name: neovim

    - name: Set pnpm executable path fact (Windows)
      when: is_windows
      ansible.builtin.set_fact:
        # NOTE: pnpm is provided by nvm-windows 2.x through its proxy shim (see install_base_packages).
        #       We use the shim's absolute path rather than 'scoop which', which follows PATH order.
        #       The path contains a space ('Author Software'), so it must be quoted when executed.
        install_lazyvim_pnpm_executable_path: "{{ install_lazyvim_win_home_dir }}/AppData/Local/Author Software/nvm/.nodejs/pnpm.exe"

    - name: Install neovim for Node.js provider (Windows)
      when: is_windows
      ansible.builtin.include_tasks: ../../../common/tasks/install_pnpm_global_packages.yml
      vars:
        pnpm_global_executable: "{{ install_lazyvim_pnpm_executable_path }}"
        pnpm_global_environment:
          HOME: "{{ ansible_facts['env']['USERPROFILE'] }}"
          USERPROFILE: "{{ ansible_facts['env']['USERPROFILE'] }}"
          PNPM_HOME: "{{ ansible_facts['env']['USERPROFILE'] }}\\AppData\\Local\\pnpm"
          PATH: "{{ install_lazyvim_win_home_dir }}/AppData/Local/pnpm:{{ ansible_facts.env.PATH }}"
        pnpm_global_packages:
          - name: neovim

    # NOTE: The LazyVim starter is only installed when the Neovim config is not already a LazyVim config
    #       (identified by the starter's 'lua/config/lazy.lua'). A missing config gets the starter; a non-LazyVim
    #       config (e.g. SpaceVim) is backed up and replaced; an existing LazyVim config, including any
    #       customisations, is left untouched. Previously every run backed up and re-cloned the config.
    - name: Check for an existing LazyVim config
      ansible.builtin.stat:
        path: "{{ (install_lazyvim_nvim_config_dir | replace('~', ansible_facts.env.HOME, 1)) ~ '/lua/config/lazy.lua' }}"
      register: install_lazyvim_existing_config_stat

    - name: Set whether the LazyVim starter needs installing
      ansible.builtin.set_fact:
        install_lazyvim_install_starter: "{{ not install_lazyvim_existing_config_stat.stat.exists }}"

    - name: Define Neovim config paths to backup (Debian/MacOS)
      when:
        - is_debian_family or is_mac
        - install_lazyvim_install_starter
      ansible.builtin.set_fact:
        install_lazyvim_nvim_backup_paths:
          - "{{ install_lazyvim_nvim_config_dir }}"
          - "~/.local/share/nvim"
          - "~/.local/state/nvim"
          - "~/.cache/nvim"

    - name: Backup current Neovim Configuration (Debian/MacOS)
      when:
        - is_debian_family or is_mac
        - install_lazyvim_install_starter
      ansible.builtin.include_tasks: ../../common/tasks/backup_directory.yml
      loop: "{{ install_lazyvim_nvim_backup_paths }}"
      loop_control:
        loop_var: item

    - name: Set git executable path (Windows)
      when: is_windows
      block:
        - name: Check for Git in standard locations
          ansible.builtin.stat:
            path: "{{ item }}"
          loop:
            - "{{ install_lazyvim_win_home_dir }}/scoop/shims/git.exe"
            - "{{ install_lazyvim_win_home_dir }}/scoop/apps/git/current/cmd/git.exe"
            - "/c/PROGRA~1/Git/cmd/git.exe"
            - "/c/PROGRA~1/Git/bin/git.exe"
          register: install_lazyvim_git_check

        - name: Set git executable path fact
          ansible.builtin.set_fact:
            install_lazyvim_git_executable: "{{ (install_lazyvim_git_check.results | selectattr('stat.exists') | map(attribute='item') | first) | default('git') }}"

    - name: Backup current Neovim Configuration and install LazyVim (Windows)
      when:
        - is_windows
        - install_lazyvim_install_starter
      block:
        - name: Check for nvim config directory
          ansible.builtin.stat:
            path: "{{ install_lazyvim_localappdata_posix }}/nvim"
          register: install_lazyvim_nvim_config_dir_stat

        - name: Backup nvim config directory
          when: install_lazyvim_nvim_config_dir_stat.stat.exists
          ansible.builtin.command:
            cmd: >
              mv "{{ install_lazyvim_localappdata_posix }}/nvim"
              "{{ install_lazyvim_localappdata_posix }}/nvim.bak-{{ ansible_facts.date_time.iso8601_basic_short }}"
          register: install_lazyvim_backup_nvim_config_result
          failed_when: false
          changed_when: install_lazyvim_backup_nvim_config_result.rc == 0

        - name: Warn if backup of nvim config directory failed
          when:
            - install_lazyvim_nvim_config_dir_stat.stat.exists
            - install_lazyvim_backup_nvim_config_result.rc != 0
          ansible.builtin.debug:
            msg: "WARNING: Could not backup {{ install_lazyvim_localappdata_posix }}/nvim due to permission errors. Skipping backup."

        - name: Check for nvim-data directory
          ansible.builtin.stat:
            path: "{{ install_lazyvim_localappdata_posix }}/nvim-data"
          register: install_lazyvim_nvim_data_dir_stat

        - name: Backup nvim-data directory
          when: install_lazyvim_nvim_data_dir_stat.stat.exists
          ansible.builtin.command:
            cmd: >
              mv "{{ install_lazyvim_localappdata_posix }}/nvim-data"
              "{{ install_lazyvim_localappdata_posix }}/nvim-data.bak-{{ ansible_facts.date_time.iso8601_basic_short }}"
          register: install_lazyvim_backup_nvim_data_result
          failed_when: false
          changed_when: install_lazyvim_backup_nvim_data_result.rc == 0

        - name: Warn if backup of nvim-data directory failed
          when:
            - install_lazyvim_nvim_data_dir_stat.stat.exists
            - install_lazyvim_backup_nvim_data_result.rc != 0
          ansible.builtin.debug:
            msg: "WARNING: Could not backup {{ install_lazyvim_localappdata_posix }}/nvim-data due to permission errors. Skipping backup."

        - name: Clone LazyVim starter
          ansible.builtin.git:
            repo: "https://github.com/LazyVim/starter"
            dest: "{{ install_lazyvim_localappdata_posix }}/nvim"
            version: main
            executable: "{{ install_lazyvim_git_executable | default(omit) }}"

        - name: Check for .git folder
          ansible.builtin.stat:
            path: "{{ install_lazyvim_localappdata_posix }}/nvim/.git"
          register: install_lazyvim_git_folder_stat

        - name: Remove .git folder
          when: install_lazyvim_git_folder_stat.stat.exists
          ansible.builtin.command:
            cmd: rm -rf "{{ install_lazyvim_localappdata_posix }}/nvim/.git"
          changed_when: true

    - name: Install LazyVim
      when:
        - is_debian_family or is_mac
        - install_lazyvim_install_starter
      block:
        - name: Clone LazyVim starter
          ansible.builtin.git:
            repo: "https://github.com/LazyVim/starter"
            dest: "{{ install_lazyvim_nvim_config_dir | replace('~', ansible_facts.env.HOME, 1) }}"
            version: main

        - name: Remove .git folder
          ansible.builtin.file:
            path: "{{ install_lazyvim_nvim_config_dir | replace('~', ansible_facts.env.HOME, 1) }}/.git"
            state: absent

    - name: Install Nerd Font
      block:
        - name: Install Nerd Font on MacOS
          when: is_mac
          community.general.homebrew_cask:
            name: font-caskaydia-cove-nerd-font
            state: present
            update_homebrew: true

        - name: Install Nerd Font on Debian
          when: is_debian_family
          block:
            # NOTE: The archive is deleted by a handler after unpacking, so without this check every run
            #       downloaded it again (and re-ran both handlers).
            - name: Check if the Nerd Font is installed (Debian)
              ansible.builtin.stat:
                path: "{{ ansible_facts.env.HOME }}/.local/share/fonts/CaskaydiaCoveNerdFont-Regular.ttf"
              register: install_lazyvim_nerd_font_stat

            - name: Install Nerd Font (Debian)
              when: not install_lazyvim_nerd_font_stat.stat.exists
              check_mode: false
              ansible.builtin.get_url:
                url: https://github.com/ryanoasis/nerd-fonts/releases/download/v3.0.2/CascadiaCode.tar.xz
                dest: "/tmp/CascadiaCode.tar.gz"
                # NOTE: This release predates GitHub's asset digests, so its checksum is kept here.
                checksum: sha256:d21d11c3703287663d5c5e72b3f75269fd8adc9f87f03c091b6c71805094bf2e
                mode: "0644"
              register: install_lazyvim_download
              notify:
                - Update font cache
                - Remove font archive

            - name: Ensure font directory exists
              ansible.builtin.file:
                path: "{{ ansible_facts.env.HOME }}/.local/share/fonts"
                state: directory
                mode: "0755"

            - name: Unarchive font
              when: not install_lazyvim_nerd_font_stat.stat.exists
              ansible.builtin.unarchive:
                src: "/tmp/CascadiaCode.tar.gz"
                dest: "{{ ansible_facts.env.HOME }}/.local/share/fonts"
                remote_src: true
                creates: "{{ ansible_facts.env.HOME }}/.local/share/fonts/CaskaydiaCoveNerdFont-Regular.ttf"

    - name: Configure the terminal emulator to use the new Nerd Font
      block:
        - name: Configure XFCE Terminal to use Nerd Font on Debian-based systems
          when: is_debian_family
          block:
            - name: Ensure XFCE Terminal configuration directory exists
              ansible.builtin.file:
                path: "{{ ansible_facts.env.HOME }}/.config/xfce4/terminal"
                state: directory
                mode: "0755"

            - name: Configure XFCE Terminal to use Nerd Font
              ansible.builtin.lineinfile:
                path: "{{ ansible_facts.env.HOME }}/.config/xfce4/terminal/terminalrc"
                regexp: "^FontName="
                line: "FontName=CaskaydiaCove Nerd Font 10"
                create: true
                mode: "0644"

    - name: Configure Terminal app to use Nerd Font on MacOS
      when: is_mac
      block:
        - name: Check current Terminal font
          ansible.builtin.command: >
            osascript -e 'tell application "Terminal"
              repeat with profileName in (get every settings set)
                  if font name of profileName is not "CaskaydiaCove Nerd Font" or font size of profileName is not 14 then
                      return false
                  end if
              end repeat
              return true
            end tell'
          register: install_lazyvim_terminal_font_check
          changed_when: false

        - name: Set font for all Terminal profiles
          when: install_lazyvim_terminal_font_check.stdout != "true"
          ansible.builtin.command: >
            osascript -e 'tell application "Terminal"
              repeat with profileName in (get every settings set)
                  set font name of profileName to "CaskaydiaCove Nerd Font"
                  set font size of profileName to 14
              end repeat
            end tell'
          changed_when: true

    # NOTE: This block used to be nested inside the macOS-only block above, so it never ran on Windows.
    - name: Configure MINTTY to use Nerd Font on Windows
      when: is_windows
      block:
        # NOTE: Preserving the timestamps makes `touch` a no-op (not `changed`) when the file exists.
        - name: Ensure .minttyrc file exists
          ansible.builtin.file:
            path: "{{ install_lazyvim_minttyrc_file }}"
            state: touch
            mode: "0644"
            access_time: preserve
            modification_time: preserve

        - name: Update .minttyrc to use Nerd Font
          ansible.builtin.lineinfile:
            path: "{{ install_lazyvim_minttyrc_file }}"
            regexp: "^Font="
            line: "Font=CaskaydiaCove Nerd Font"
