# Set to true to apply XFCE-specific Kinto configuration on Windows.
# This is for users running an XFCE desktop environment inside WSL2.
configure_keyboard_enable_windows_xfce_mode: true

# Kinto keyboard type on Windows: 'win' when the key left of the spacebar sends Alt (Windows layouts,
# and multi-OS keyboards such as Logitech's in Windows mode), 'mac' when it sends Win (Apple layouts).
configure_keyboard_windows_kinto_kbtype: win

# Type British - Mac characters (Shift+2 = @, Opt+3 = #, and so on) on a UK keyboard.
# Windows: Kinto remaps on top of the "United Kingdom" layout. XFCE: the built-in xkb layout below.
configure_keyboard_windows_mac_gb_layout: true
configure_keyboard_xfce_xkb_layout: gb
configure_keyboard_xfce_xkb_variant: mac
# WSL2 XFCE (over XRDP): Kinto's Windows-keyboard modifier swap, done by xkb.
# Left Alt (Cmd) -> Ctrl, Left Ctrl -> Super, Left Win (Opt) -> Alt.
configure_keyboard_xrdp_xkb_options: ctrl:swap_lalt_lctl_lwin

# Kinto is downloaded at this upstream commit (master as of Jan 2024), not from the branch, so a push to
# rbreaves/kinto can't change what runs here. To update, review the upstream changes and bump the commit
# and the checksum of the Linux installer (`sha256sum` of install/linux.sh at that commit).
configure_keyboard_kinto_commit: 4a3bfe79e2578dd85cb6ff2ebc5505f758c64ab6
configure_keyboard_kinto_extracted_dir: "kinto-{{ configure_keyboard_kinto_commit }}"
configure_keyboard_kinto_linux_installer_checksum: sha256:f2049ad3132fb016ca184db5f516523958ba35fa5be319872eea283f6613d795

configure_keyboard_linux_kinto_config_path: "/home/{{ ansible_facts.user_id }}/.config/kinto/kinto.py"
# NOTE: The following path is an assumption based on common application behavior on Windows.
#       The actual path will be determined by Kinto's setup.py and Python's installation location.
configure_keyboard_windows_kinto_config_path: "{{ ansible_facts.env.APPDATA }}\\kinto\\kinto.py"

configure_keyboard_kinto_config_path: "{{ configure_keyboard_linux_kinto_config_path if not is_windows else configure_keyboard_windows_kinto_config_path }}"

configure_keyboard_xfce4_shortcut_deletion_script_path: "scripts/remove_xfce4_workspace_switch_shortcuts.sh"
configure_keyboard_xfce4_shortcut_creation_script_path: "scripts/create_xfce4_workspace_switch_shortcuts.sh"
configure_keyboard_macos_shortcut_creation_script_path: "scripts/create_macos_workspace_switch_shortcuts.sh"
