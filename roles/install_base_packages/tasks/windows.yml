- name: Install windows packages
  when: is_windows
  block:
    # NOTE: The following packages are required for lazyvim and its plugins.
    #       - fd & ripgrep: Required by lazyvim and snacks for file and text searching (managed via Scoop)
    #       - luarocks: Required by lazy and mason for Lua plugin management (managed via Scoop)
    #       - mingw-w64-x86_64-imagemagick: Required by snacks for image previews
    #       - sqlite: Required by lazyvim and snacks for history and frecency (managed via Scoop)
    # NOTE: mingw-w64-x86_64-lua-luarocks, -sqlite3 and -tldr have been removed from the MSYS2
    #       mingw64 repo, so luarocks, sqlite and tealdeer (tldr) are installed via Scoop instead.
    # NOTE: Disable pacman's default 10-second download timeout in libcurl to prevent
    #       connection timeouts and transfer stalls when retrieving large packages from mirrors.
    - name: Configure pacman to disable download timeout
      ansible.builtin.lineinfile:
        path: /etc/pacman.conf
        insertafter: '^\[options\]'
        regexp: '^#?DisableDownloadTimeout'
        line: 'DisableDownloadTimeout'

    - name: Install required packages for Windows with MSYS2
      community.general.pacman:
        name:
          - mingw-w64-x86_64-python
          - mingw-w64-x86_64-python-pip
          # NOTE: mingw-w64-x86_64-python-pipx and -python-userpath have been removed from the
          #       MSYS2 mingw64 repo. pipx is not needed on Windows (it was only used for Semgrep).
          - mingw-w64-x86_64-python-setuptools
          - mingw-w64-x86_64-python-argcomplete
          - mingw-w64-x86_64-python-packaging
          - mingw-w64-x86_64-python-platformdirs
          - mingw-w64-x86_64-toolchain
          - mingw-w64-x86_64-rust
          - mingw-w64-x86_64-maturin
          - mingw-w64-x86_64-python-cffi
          - mingw-w64-x86_64-python-bcrypt
          - mingw-w64-x86_64-python-cryptography
          # NOTE: mingw-w64-x86_64-jq has been removed from the MSYS2 mingw64 repo.
          #       The MSYS jq package provides /usr/bin/jq, which is what Ansible's shell tasks use.
          - jq
          - mingw-w64-x86_64-imagemagick
          # NOTE: unzip is required by ansible.builtin.unarchive for .zip files (e.g. the Kinto download
          #       in configure_keyboard). It is listed explicitly rather than relied on as a transitive dependency.
          - unzip
          - bash-completion
          - stow
          - tree
          - openssh
        state: latest
        update_cache: true
        extra_args: --overwrite "*"
      register: install_base_packages_pacman_result
      until: install_base_packages_pacman_result is not failed
      retries: 3
      delay: 5

    - name: Install Scoop packages
      block:
        - name: Get user's home directory in POSIX format
          ansible.builtin.command:
            cmd: cygpath -u "{{ ansible_facts['env']['USERPROFILE'] }}"
          register: install_base_packages_win_home_posix_raw
          changed_when: false

        - name: Set scoop root and executable facts
          ansible.builtin.set_fact:
            install_base_packages_win_home_posix: "{{ install_base_packages_win_home_posix_raw.stdout | trim }}"
            install_base_packages_scoop_root: "{{ install_base_packages_win_home_posix_raw.stdout | trim }}/scoop"
            install_base_packages_scoop_root_win: "{{ ansible_facts['env']['USERPROFILE'] }}\\scoop"
            install_base_packages_scoop_executable_path: "{{ install_base_packages_win_home_posix_raw.stdout | trim }}/scoop/shims/scoop.cmd"

    - name: Remove conflicting system Node.js installation
      ansible.builtin.command:
        cmd: powershell.exe -Command "Remove-Item -Path 'C:\Program Files\nodejs' -Recurse -Force -ErrorAction SilentlyContinue"
      register: install_base_packages_remove_node_result
      failed_when: false
      changed_when: false

    - name: Set fact if Node.js removal failed
      ansible.builtin.set_fact:
        install_base_packages_node_removal_failed: "{{ install_base_packages_remove_node_result.rc != 0 }}"

    - name: Ensure required Scoop buckets are added
      ansible.builtin.command:
        cmd: "{{ install_base_packages_scoop_executable_path }} bucket add {{ item }}"
      loop:
        - main
        - extras
        - nerd-fonts
      register: scoop_bucket_add
      failed_when:
        - scoop_bucket_add.rc != 0
        - "'already added' not in scoop_bucket_add.stdout"
      changed_when: "'Successfully added' in scoop_bucket_add.stdout"

    - name: Update Scoop and buckets
      ansible.builtin.command:
        cmd: "{{ install_base_packages_scoop_executable_path }} update"
      changed_when: false
      ignore_errors: true

    - name: Define Scoop packages list
      ansible.builtin.set_fact:
        install_base_packages_scoop_list:
          # NOTE: nvm-windows is intentionally not installed via Scoop. nvm-windows 2.x refuses to support
          #       running from outside its per-user install root (NVM4101), and Scoop extracts it into
          #       scoop/apps/nvm. It is installed from the official installer further below.
          - name: gh
            executable_name: gh
          - name: gnupg
            executable_name: gpg
          - name: neovim
            executable_name: nvim
          - name: lazygit
            executable_name: lazygit
          - name: alacritty
            executable_name: alacritty
          - name: cascadiacode-nf
          - name: fzf
            executable_name: fzf
          - name: ripgrep
            executable_name: rg
          - name: fd
            executable_name: fd
          - name: luarocks
            executable_name: luarocks
          - name: sqlite
            executable_name: sqlite3
          # NOTE: tealdeer is a Rust tldr client, matching the Linux role (exposes 'tldr').
          - name: tealdeer
            executable_name: tldr
          - name: perl
            executable_name: perl
          # NOTE: pnpm is intentionally not installed via Scoop. nvm-windows 2.x (shim mode) places its own
          #       pnpm/yarn proxy shims on the user PATH ahead of Scoop's shims and routes them to the copy of
          #       pnpm installed in the active Node.js version, so pnpm is installed through nvm further below.
          # NOTE: starship uses env_add_path instead of standard Scoop shims (for performance).
          #       We set skip_which_check to true to avoid 'scoop which' validation failures.
          - name: starship
            executable_name: starship
            skip_which_check: true

    - name: Process Scoop packages
      ansible.builtin.include_tasks: ../../../common/tasks/install_scoop_package.yml
      loop: "{{ install_base_packages_scoop_list }}"
      loop_control:
        loop_var: scoop_package

    # NOTE: Earlier versions of this playbook installed pnpm via Scoop. Remove it so only the
    #       nvm-managed pnpm remains (see the NOTE in the Scoop packages list above).
    - name: Check for Scoop-managed pnpm
      ansible.builtin.command:
        cmd: "{{ install_base_packages_scoop_executable_path }} list pnpm"
      register: install_base_packages_scoop_pnpm_status
      changed_when: false
      failed_when: false
      environment:
        HOME: "{{ ansible_facts['env']['USERPROFILE'] }}"
        USERPROFILE: "{{ ansible_facts['env']['USERPROFILE'] }}"

    # NOTE: failed_when is false because a partially removed install (listed as 'Install failed') can make
    #       'scoop uninstall' error. Any leftover app directory is removed after pnpm's config is cleaned up below.
    - name: Remove Scoop-managed pnpm
      when: install_base_packages_scoop_pnpm_status.stdout is search('(?m)^pnpm\\s+')
      ansible.builtin.command:
        cmd: "{{ install_base_packages_scoop_executable_path }} uninstall pnpm"
      register: install_base_packages_scoop_pnpm_uninstall
      changed_when: "'was uninstalled' in install_base_packages_scoop_pnpm_uninstall.stdout"
      failed_when: false
      environment:
        HOME: "{{ ansible_facts['env']['USERPROFILE'] }}"
        USERPROFILE: "{{ ansible_facts['env']['USERPROFILE'] }}"

    # NOTE: nvm-windows 2.x is installed per-user into '%LOCALAPPDATA%\Author Software\nvm' by its official
    #       installer (PrivilegesRequired=lowest, so no elevation is needed). That path contains a space, so
    #       executables under it must be quoted when passed to ansible.builtin.command.
    - name: Set nvm-windows facts
      ansible.builtin.set_fact:
        install_base_packages_nvm_home: "{{ install_base_packages_win_home_posix }}/AppData/Local/Author Software/nvm"
        install_base_packages_nvm_executable_path: "{{ install_base_packages_win_home_posix }}/AppData/Local/Author Software/nvm/nvm.exe"
        install_base_packages_nvm_shim_dir: "{{ install_base_packages_win_home_posix }}/AppData/Local/Author Software/nvm/.nodejs"
        install_base_packages_pnpm_executable_path: "{{ install_base_packages_win_home_posix }}/AppData/Local/Author Software/nvm/.nodejs/pnpm.exe"

    # NOTE: Earlier versions of this playbook installed nvm via Scoop (see the NOTE in the Scoop packages list).
    #       Its uninstaller removes its scoop/apps/nvm PATH entry and NVM_HOME; its data in scoop/persist/nvm
    #       is cleaned up below once the official install has taken over.
    - name: Check for Scoop-managed nvm
      ansible.builtin.command:
        cmd: "{{ install_base_packages_scoop_executable_path }} list nvm"
      register: install_base_packages_scoop_nvm_status
      changed_when: false
      failed_when: false
      environment:
        HOME: "{{ ansible_facts['env']['USERPROFILE'] }}"
        USERPROFILE: "{{ ansible_facts['env']['USERPROFILE'] }}"

    - name: Remove Scoop-managed nvm
      when: install_base_packages_scoop_nvm_status.stdout is search('(?m)^nvm\\s+')
      ansible.builtin.command:
        cmd: "{{ install_base_packages_scoop_executable_path }} uninstall nvm"
      register: install_base_packages_scoop_nvm_uninstall
      changed_when: "'was uninstalled' in install_base_packages_scoop_nvm_uninstall.stdout"
      environment:
        HOME: "{{ ansible_facts['env']['USERPROFILE'] }}"
        USERPROFILE: "{{ ansible_facts['env']['USERPROFILE'] }}"

    - name: Check if nvm-windows is installed
      ansible.builtin.stat:
        path: "{{ install_base_packages_nvm_executable_path }}"
      register: install_base_packages_nvm_executable_stat

    - name: Install nvm-windows from the official installer
      when: not install_base_packages_nvm_executable_stat.stat.exists
      block:
        - name: Get latest nvm-windows release from GitHub
          ansible.builtin.uri:
            url: https://api.github.com/repos/nvm-windows/nvm/releases/latest
            headers:
              Accept: application/vnd.github+json
            return_content: true
          register: install_base_packages_nvm_release

        - name: Select nvm-windows installer asset
          ansible.builtin.set_fact:
            install_base_packages_nvm_installer_asset: >-
              {{ install_base_packages_nvm_release.json.assets
                 | selectattr('name', 'search', '-' ~ ('arm64' if (is_arm64 | default(false)) else 'x64') ~ '-setup\.exe$')
                 | first }}

        # NOTE: GitHub publishes a 'sha256:<hex>' digest for each release asset, which get_url verifies.
        - name: Download nvm-windows installer
          ansible.builtin.get_url:
            url: "{{ install_base_packages_nvm_installer_asset.browser_download_url }}"
            dest: "{{ install_base_packages_win_home_posix }}/Downloads/nvm-setup.exe"
            checksum: "{{ install_base_packages_nvm_installer_asset.digest }}"
            mode: "0755"

        - name: Run nvm-windows installer silently
          ansible.builtin.command:
            cmd: >-
              powershell.exe -NoProfile -Command "
              $p = Start-Process -FilePath (Join-Path $env:USERPROFILE 'Downloads\nvm-setup.exe')
              -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-','/LANG=english' -Wait -PassThru;
              exit $p.ExitCode"
            creates: "{{ install_base_packages_nvm_executable_path }}"
            # NOTE: See the NOTE on the user PATH task below for why this must be false.
            expand_argument_vars: false

        - name: Remove nvm-windows installer
          ansible.builtin.file:
            path: "{{ install_base_packages_win_home_posix }}/Downloads/nvm-setup.exe"
            state: absent

    # NOTE: When upgrading from a Scoop install, the official installer adopts the existing Node.js root under
    #       scoop/persist/nvm. Reset it to nvm's default ('%LOCALAPPDATA%\Author Software\nvm\installs') so the
    #       layout matches a fresh machine; Node.js LTS is then (re)installed there below.
    - name: Get nvm Node.js install root
      ansible.builtin.command:
        cmd: "\"{{ install_base_packages_nvm_executable_path }}\" cfg get root"
      register: install_base_packages_nvm_root
      changed_when: false

    - name: Reset nvm Node.js install root left over from Scoop
      when: "'scoop' in (install_base_packages_nvm_root.stdout | lower)"
      ansible.builtin.command:
        cmd: "\"{{ install_base_packages_nvm_executable_path }}\" cfg reset root"
      changed_when: true

    - name: Install Node.js LTS via NVM
      ansible.builtin.command:
        cmd: "\"{{ install_base_packages_nvm_executable_path }}\" install lts"
      register: install_base_packages_nvm_install
      changed_when: "'is already installed' not in install_base_packages_nvm_install.stdout"
      failed_when:
        - install_base_packages_nvm_install.rc != 0
        - "'already installed' not in install_base_packages_nvm_install.stdout"

    - name: Set Node.js version fact from NVM install output
      ansible.builtin.set_fact:
        # NOTE: nvm-windows output contains "Installing node.js vXX.XX.XX" or "Version XX.XX.XX is already installed."
        #       nvm-windows 2.x instead prints e.g. "SKIPPED: vXX.XX.XX is already installed", so we also accept a bare
        #       'vXX.XX.XX'. Without a version, 'nvm use' and the pnpm setup below are skipped.
        #       We use regex_findall to extract the version following 'v' or 'Version ' and pick the first match.
        install_base_packages_nvm_node_version: "{{ install_base_packages_nvm_install.stdout | regex_findall('(?:node\\.js v|Version |\\bv)(\\d+\\.\\d+\\.\\d+)') | first | default('') }}"

    - name: Use Node.js LTS via NVM
      ansible.builtin.command:
        cmd: "\"{{ install_base_packages_nvm_executable_path }}\" use {{ install_base_packages_nvm_node_version }}"
      when:
        - install_base_packages_nvm_node_version is defined
        - install_base_packages_nvm_node_version != ""
      changed_when: false
      failed_when: false

    # NOTE: nvm-windows 2.x (shim mode) exposes node/npm/pnpm/yarn through proxy shims in
    #       '%LOCALAPPDATA%\Author Software\nvm\.nodejs'. Its installer does not reliably add that directory to the
    #       user PATH (an upgrade from Scoop kept Scoop's old scoop/persist/nvm/.nodejs entry instead), so we manage
    #       it here and drop the stale Scoop entry. pnpm's global bin directory (PNPM_HOME) is added too, so global
    #       CLIs such as 'rafter' and 'tree-sitter' are on PATH, as are the bin directories of the Claude Code
    #       ('%USERPROFILE%\.local\bin') and agy ('%LOCALAPPDATA%\agy\bin') CLIs installed by configure_mcp_servers,
    #       whose official installers do not add them.
    # NOTE: expand_argument_vars must be false for any command task that embeds PowerShell. Otherwise the
    #       command module expands '$NAME' environment variables in the arguments, and PowerShell's pipeline
    #       variable '$_' is replaced with bash's '$_' (the last command run, e.g. /usr/bin/python3.14). That
    #       silently broke the Where-Object filter below and wiped the user PATH down to the added entries.
    # NOTE: The raw (unexpanded) registry value is read and written as REG_EXPAND_SZ, so entries such as
    #       '%USERPROFILE%\AppData\Local\Microsoft\WindowsApps' are preserved rather than flattened.
    #       As a safeguard, nothing is written if more than the stale entry would be dropped.
    - name: Ensure nvm shims and pnpm global bin directory are on the user PATH
      ansible.builtin.command:
        cmd: >-
          powershell.exe -NoProfile -Command "
          $ErrorActionPreference = 'Stop';
          $key = Get-Item -Path 'HKCU:\Environment';
          $current = [string]$key.GetValue('Path', '', 'DoNotExpandEnvironmentNames');
          $stale = Join-Path $env:USERPROFILE 'scoop\persist\nvm\.nodejs';
          $wanted = @(
            (Join-Path $env:LOCALAPPDATA 'Author Software\nvm\.nodejs'),
            (Join-Path $env:LOCALAPPDATA 'pnpm'),
            (Join-Path $env:USERPROFILE '.local\bin'),
            (Join-Path $env:LOCALAPPDATA 'agy\bin'));
          $original = @($current -split ';' | Where-Object { $_ });
          $entries = @($original | Where-Object { $_ -ine $stale });
          if ($entries.Count -lt ($original.Count - 1)) { throw ('Refusing to update PATH: filter would drop ' + ($original.Count - $entries.Count) + ' entries') };
          foreach ($w in $wanted) { if (-not ($entries | Where-Object { $_ -ieq $w })) { $entries += $w } };
          $updated = $entries -join ';';
          if ($updated -ne $current) {
            Set-ItemProperty -Path 'HKCU:\Environment' -Name 'Path' -Value $updated -Type ExpandString;
            [Environment]::SetEnvironmentVariable('LMC_PATH_REFRESH', '1', 'User');
            [Environment]::SetEnvironmentVariable('LMC_PATH_REFRESH', $null, 'User');
            Write-Output 'PATH updated'
          }"
        expand_argument_vars: false
      register: install_base_packages_user_path_update
      changed_when: "'PATH updated' in install_base_packages_user_path_update.stdout"

    # NOTE: nvm-windows 2.x's pnpm proxy runs the pnpm installed in the active Node.js version, so we install
    #       pnpm there with npm. Node.js 25+ no longer bundles corepack, so 'corepack enable' (as suggested by
    #       the proxy's error message) is not an option.
    - name: Provide pnpm via nvm-windows
      when:
        - install_base_packages_nvm_node_version is defined
        - install_base_packages_nvm_node_version != ""
      block:
        - name: Get nvm auto-installed modules
          ansible.builtin.command:
            cmd: "\"{{ install_base_packages_nvm_executable_path }}\" cfg get auto_installed_modules"
          register: install_base_packages_nvm_auto_modules
          changed_when: false

        # NOTE: Ensures pnpm is installed automatically into any Node.js version nvm installs in future.
        - name: Configure nvm to auto-install pnpm with new Node.js versions
          when: "'pnpm' not in install_base_packages_nvm_auto_modules.stdout"
          ansible.builtin.command:
            cmd: "\"{{ install_base_packages_nvm_executable_path }}\" cfg set auto_installed_modules=pnpm"
          changed_when: true

        # NOTE: npm 11.20+ skips install scripts that are not explicitly allowed, and pnpm uses them to set itself up.
        - name: Install pnpm into the active Node.js version
          ansible.builtin.command:
            cmd: "\"{{ install_base_packages_nvm_shim_dir }}/npm.exe\" install -g --allow-scripts=pnpm pnpm"
            creates: "{{ install_base_packages_nvm_home }}/installs/v{{ install_base_packages_nvm_node_version }}/node_modules/pnpm/package.json"

        # NOTE: nvm prompts before running global modules it does not yet trust ('untrusted_module_handler_action'),
        #       which would hang a non-interactive run. 'nvm reshim' re-trusts package-manager entrypoints.
        - name: Rebuild and re-trust nvm shims
          ansible.builtin.command:
            cmd: "\"{{ install_base_packages_nvm_executable_path }}\" reshim"
          register: install_base_packages_nvm_reshim
          changed_when: "'up to date' not in (install_base_packages_nvm_reshim.stdout ~ install_base_packages_nvm_reshim.stderr)"

        # NOTE: Scoop's pnpm manifest writes storeDir/cacheDir/stateDir into pnpm's global config, pointing at
        #       scoop/apps/pnpm/current. Uninstalling Scoop's pnpm leaves those settings behind, so the nvm-managed
        #       pnpm keeps recreating that directory (which Scoop then lists as 'Install failed'). Removing the
        #       settings restores pnpm's defaults under PNPM_HOME.
        - name: Get pnpm directory settings
          ansible.builtin.command:
            cmd: "\"{{ install_base_packages_pnpm_executable_path }}\" config get {{ item }}"
          loop:
            - store-dir
            - cache-dir
            - state-dir
          register: install_base_packages_pnpm_dir_settings
          changed_when: false
          environment:
            PNPM_HOME: "{{ ansible_facts['env']['USERPROFILE'] }}\\AppData\\Local\\pnpm"

        - name: Remove pnpm directory settings left by Scoop's pnpm
          # NOTE: '.' matches either path separator, avoiding backslash escaping through YAML and Jinja.
          when: item.stdout is search('scoop.apps.pnpm', ignorecase=true)
          ansible.builtin.command:
            cmd: "\"{{ install_base_packages_pnpm_executable_path }}\" config delete {{ item.item }}"
          loop: "{{ install_base_packages_pnpm_dir_settings.results }}"
          loop_control:
            label: "{{ item.item }}"
          changed_when: true
          environment:
            PNPM_HOME: "{{ ansible_facts['env']['USERPROFILE'] }}\\AppData\\Local\\pnpm"

        - name: Remove leftover Scoop pnpm app directory
          ansible.builtin.file:
            path: "{{ install_base_packages_scoop_root }}/apps/pnpm"
            state: absent

        # NOTE: Node.js versions, shims and caches from the old Scoop-managed nvm. By this point the official
        #       install owns the Node.js root and its own shims, so this data is no longer referenced.
        #       nvm protects its .shim directory and the (hard-linked) proxy executables in it with explicit ACLs that
        #       only grant the user read/execute and WRITE_DAC, so ansible.builtin.file cannot delete them. We grant the
        #       user full control first. The grant must be a plain ':F' (not '(OI)(CI)F'): inheritance flags only
        #       affect directories, so they leave the files' explicit ACLs unchanged.
        - name: Remove leftover Scoop nvm data directory
          ansible.builtin.command:
            cmd: >-
              powershell.exe -NoProfile -Command "
              $d = Join-Path $env:USERPROFILE 'scoop\persist\nvm';
              if (Test-Path -LiteralPath $d) {
                icacls $d /grant ($env:USERNAME + ':F') /T /C /Q | Out-Null;
                Remove-Item -LiteralPath $d -Recurse -Force -ErrorAction Stop;
                Write-Output 'removed'
              }"
            # NOTE: See the NOTE on the user PATH task above for why this must be false.
            expand_argument_vars: false
          register: install_base_packages_scoop_nvm_data_removal
          changed_when: "'removed' in install_base_packages_scoop_nvm_data_removal.stdout"

    - name: Download and Install AutoHotkey v1.1
      block:
        # NOTE: We are not using scoop to install AutoHotkey because the manifest
        #       points to the official website, which is protected by Cloudflare and
        #       returns a 403 Forbidden error. Instead, we download the installer
        #       from the official GitHub releases.
        - name: Download AutoHotkey v1.1 installer
          ansible.builtin.get_url:
            url: https://github.com/AutoHotkey/AutoHotkey/releases/download/v1.1.37.02/AutoHotkey_1.1.37.02_setup.exe
            dest: /tmp/autohotkey_setup.exe
            mode: '0755'

        - name: Install AutoHotkey v1.1 silently
          ansible.builtin.command:
            cmd: powershell.exe -Command "/tmp/autohotkey_setup.exe /S"
          args:
            creates: /c/Program Files/AutoHotkey/AutoHotkey.exe
          register: install_base_packages_install_ahk
          changed_when: install_base_packages_install_ahk.rc == 0
          ignore_errors: true

        - name: Set fact if AutoHotkey installation failed due to permissions
          ansible.builtin.set_fact:
            install_base_packages_autohotkey_install_failed_due_to_permissions: >-
              {{ install_base_packages_install_ahk.failed and
                 ('Permission denied' in install_base_packages_install_ahk.stderr or
                  'access is denied' in install_base_packages_install_ahk.stderr or
                  'failed to start' in install_base_packages_install_ahk.stderr or
                  'denied' in install_base_packages_install_ahk.stdout or
                  'failed' in install_base_packages_install_ahk.stdout) }}
          when: install_base_packages_install_ahk.failed

        - name: Adjust has_admin_privileges fact if AutoHotkey installation failed due to permissions
          ansible.builtin.set_fact:
            install_base_packages_has_admin_privileges: false
          when:
            - install_base_packages_autohotkey_install_failed_due_to_permissions is defined
            - install_base_packages_autohotkey_install_failed_due_to_permissions

    # NOTE: install_base_packages_pnpm_executable_path is set in 'Set nvm-windows facts' above.
    #       We no longer resolve pnpm with 'scoop which', which follows PATH order and returns nvm's proxy shim.
    - name: Ensure pnpm global directory exists
      ansible.builtin.file:
        path: "{{ install_base_packages_win_home_posix }}/AppData/Local/pnpm"
        state: directory
        mode: "0755"

    - name: Configure pnpm global-bin-dir
      ansible.builtin.command:
        cmd: "\"{{ install_base_packages_pnpm_executable_path }}\" config set global-bin-dir \"{{ ansible_facts['env']['USERPROFILE'] }}\\AppData\\Local\\pnpm\""
      changed_when: false

    # NOTE: In pnpm v10+, pnpm-home is not a supported config key in config.yaml.
    #       PNPM_HOME is an environment variable pointing to the global directory.
    - name: Configure PNPM_HOME user environment variable
      ansible.builtin.command:
        cmd: powershell.exe -Command "[Environment]::SetEnvironmentVariable('PNPM_HOME', '{{ ansible_facts['env']['USERPROFILE'] }}\\AppData\\Local\\pnpm', 'User')"
      changed_when: false

    # NOTE: We explicitly add nvm's shim directory to the PATH to ensure that
    #       pnpm (and build scripts such as tree-sitter-cli's) can find node even if the
    #       shell environment hasn't been refreshed yet.
    - name: Set pnpm install PATH fact
      ansible.builtin.set_fact:
        install_base_packages_pnpm_install_path: >-
          {{ install_base_packages_win_home_posix }}/AppData/Local/pnpm:{{ install_base_packages_nvm_shim_dir }}:{{ ansible_facts.env.PATH }}

    - name: Install pnpm packages
      # NOTE: We use the absolute path to nvm's pnpm proxy shim to ensure we are using the
      #       nvm-managed pnpm for the active Node.js version.
      ansible.builtin.command:
        cmd: "\"{{ install_base_packages_pnpm_executable_path }}\" add -g {{ item }}"
      environment:
        PNPM_HOME: "{{ ansible_facts['env']['USERPROFILE'] }}\\AppData\\Local\\pnpm"
        PATH: "{{ install_base_packages_pnpm_install_path }}"
      with_items:
        - neovim
        # NOTE: Rafter is the local command-safety layer used by AI agents. Installing it
        #       globally puts `rafter` on PATH, which is what the agent guard hooks invoke.
        - "@rafter-security/cli"
      changed_when: false

    # NOTE: pnpm >= 10 ignores lifecycle scripts by default, so tree-sitter-cli's install script
    #       (which downloads the native `tree-sitter` binary) is skipped unless explicitly allowed
    #       via `--allow-build`. Without this, nvim-treesitter fails with a `spawn ... ENOENT` error
    #       when it tries to run the missing binary.
    - name: Install tree-sitter-cli with its build script allowed
      ansible.builtin.command:
        cmd: "\"{{ install_base_packages_pnpm_executable_path }}\" add -g --allow-build=tree-sitter-cli tree-sitter-cli@latest"
      environment:
        PNPM_HOME: "{{ ansible_facts['env']['USERPROFILE'] }}\\AppData\\Local\\pnpm"
        PATH: "{{ install_base_packages_pnpm_install_path }}"
      changed_when: false
