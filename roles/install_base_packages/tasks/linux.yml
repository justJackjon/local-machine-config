- name: Install debian packages
  when: is_debian_family
  block:
    # NOTE: The following packages are required for lazyvim and its plugins.
    #       - fd-find: Required by lazyvim and snacks for file searching (fd)
    #       - lazygit: Required by lazyvim and snacks for git integration
    #       - luarocks: Required by lazy and mason for Lua plugin management
    #       - imagemagick: Required by snacks for image previews
    #       - sqlite3: Required by snacks for history and frecency
    #       - libsqlite3-dev: Required by snacks for history and frecency (dev headers)
    # NOTE: libxkbcommon0, libxkbcommon-x11-0, libxkbcommon-dev, and libxcb-xfixes0-dev are
    #       required for Alacritty to compile and dynamically load X11 keyboard libraries at runtime.
    - name: Install required packages for Debian based systems
      become: true
      ansible.builtin.apt:
        name:
          - curl
          - python3-debian # NOTE: Required by ansible.builtin.deb822_repository (gh and Docker apt repositories)
          - python3-pip
          - pipx
          - bash-completion
          - stow
          - gnupg
          - xclip
          - tealdeer # NOTE: Fast Rust implementation providing /usr/bin/tldr (legacy python 'tldr' package dropped)
          - tree
          - jq
          - ssh-askpass
          - fonts-noto-color-emoji
          - ripgrep
          - fd-find
          - luarocks
          - imagemagick
          - sqlite3
          - libsqlite3-dev
          - libfontconfig1-dev
          - libxkbcommon0
          - libxkbcommon-x11-0
          - libxkbcommon-dev
          - libxcb-xfixes0-dev
          - pkg-config
          - openssh-client
        state: latest
        update_cache: true

    - name: Install Rust via rustup
      become: true
      block:
        - name: Check if rustup is installed
          ansible.builtin.stat:
            path: "/root/.cargo/bin/rustup"
          register: install_base_packages_rustup_stat_root

        # NOTE: Not age-gated: rustup-init and the stable toolchain come from the Rust project's own servers,
        #       and rustup checks each component's SHA-256 from the signed release manifest.
        - name: Download rustup installer
          when: not install_base_packages_rustup_stat_root.stat.exists
          ansible.builtin.get_url:
            url: https://sh.rustup.rs
            dest: /tmp/rustup-init.sh
            mode: "0755"

        - name: Run rustup installer for root user
          when: not install_base_packages_rustup_stat_root.stat.exists
          ansible.builtin.command: /tmp/rustup-init.sh -y
          changed_when: true

    # NOTE: The version is the newest crates.io release older than the supply-chain cutoff (see the playbook).
    #       `locked` builds with the Cargo.lock that Alacritty published. Without it, cargo resolves every
    #       dependency to its newest compatible version at build time, including ones released minutes ago.
    #       crates.io asks API clients to send a descriptive User-Agent.
    - name: List Alacritty releases on crates.io
      ansible.builtin.uri:
        url: https://crates.io/api/v1/crates/alacritty/versions
        headers:
          User-Agent: ansible-playbook (local machine provisioning)
        return_content: true
      register: install_base_packages_alacritty_versions

    - name: Select the Alacritty release to install
      ansible.builtin.set_fact:
        install_base_packages_alacritty_version: >-
          {{ install_base_packages_alacritty_versions.json.versions
             | rejectattr('yanked') | rejectattr('num', 'search', '-')
             | selectattr('created_at', 'le', supply_chain_release_cutoff)
             | sort(attribute='created_at', reverse=true)
             | map(attribute='num') | first }}

    - name: Install Alacritty via cargo for Debian based systems
      become: true
      community.general.cargo:
        name: alacritty
        version: "{{ install_base_packages_alacritty_version }}"
        locked: true
        state: present
      environment:
        PATH: "/root/.cargo/bin:{{ ansible_facts.env.PATH }}"
        CARGO_INSTALL_ROOT: "/usr/local"

    - name: Install Alacritty desktop entry and icon
      become: true
      block:
        # NOTE: Downloads from a branch (`master`) get whatever was pushed last, so fixed files are pinned to a
        #       release tag or commit and checked against a checksum kept in this repo.
        - name: Download Alacritty icon
          ansible.builtin.get_url:
            url: https://raw.githubusercontent.com/alacritty/alacritty/v0.17.0/extra/logo/alacritty-term.svg
            dest: /usr/share/pixmaps/Alacritty.svg
            checksum: sha256:647f43a9c766f81a4f6805fcebdc2d6a8dcb989abcc50be625abf2b99b9afddb
            mode: "0644"

        - name: Install Alacritty desktop file
          ansible.builtin.copy:
            dest: /usr/share/applications/alacritty.desktop
            mode: "0644"
            content: |
              [Desktop Entry]
              Type=Application
              TryExec=alacritty
              Exec=alacritty
              Icon=Alacritty
              Terminal=false
              Categories=System;TerminalEmulator;
              Name=Alacritty
              GenericName=Terminal
              Comment=A fast, cross-platform, OpenGL terminal emulator
              StartupNotify=true
              StartupWMClass=Alacritty
              Actions=New;

              [Desktop Action New]
              Name=New Terminal
              Exec=alacritty

    - name: Install gh for Debian based systems
      become: true
      block:
        - name: Create apt keyrings directory
          ansible.builtin.file:
            path: /etc/apt/keyrings
            state: directory
            mode: "0755"

        - name: Download GitHub CLI GPG keyring
          ansible.builtin.get_url:
            url: https://cli.github.com/packages/githubcli-archive-keyring.gpg
            dest: /etc/apt/keyrings/githubcli-archive-keyring.gpg
            mode: '0644'
            force: true

        # NOTE: ansible.builtin.apt_repository is deprecated (removed in ansible-core 2.25), so the repository
        #       is written as a deb822 `github-cli.sources` file instead (needs python3-debian, installed above).
        #       The legacy one-line `github-cli.list` is removed so apt doesn't see the repository twice.
        #       Unlike apt_repository, deb822_repository doesn't refresh the apt cache, so the install below
        #       does that when the repository changed.
        - name: Remove legacy GitHub CLI apt source list
          ansible.builtin.file:
            path: /etc/apt/sources.list.d/github-cli.list
            state: absent

        - name: Add GitHub CLI apt repository
          ansible.builtin.deb822_repository:
            name: github-cli
            types: deb
            uris: https://cli.github.com/packages
            suites: stable
            components: main
            architectures: "{{ 'amd64' if ansible_facts.architecture == 'x86_64' else 'arm64' if ansible_facts.architecture == 'aarch64' else 'i386' }}"
            signed_by: /etc/apt/keyrings/githubcli-archive-keyring.gpg
          register: install_base_packages_gh_repository

        - name: Install latest gh CLI
          ansible.builtin.apt:
            name: gh
            state: latest
            update_cache: true

    - name: Install lazygit
      become: true
      block:
        - name: Install lazygit from apt on Debian >= 13 or Ubuntu >= 25.10
          when: >
            (ansible_facts.distribution == 'Debian' and ansible_facts.distribution_version | float >= 13) or
            (ansible_facts.distribution == 'Ubuntu' and ansible_facts.distribution_version | float >= 25.10)
          ansible.builtin.apt:
            name: lazygit
            state: present
            update_cache: true

        - name: Install lazygit from source on older Debian/Ubuntu
          when: >
            (ansible_facts.distribution == 'Debian' and ansible_facts.distribution_version | float < 13) or
            (ansible_facts.distribution == 'Ubuntu' and ansible_facts.distribution_version | float < 25.10)
          block:
            - name: Find the newest lazygit release older than the supply-chain cutoff
              ansible.builtin.include_tasks: ../../../common/tasks/resolve_github_release.yml
              vars:
                resolve_github_release_repo: jesseduffield/lazygit

            # NOTE: lazygit's assets were renamed from `_Linux_x86_64` to `_linux_x86_64` (seen in v0.66.3),
            #       which broke the old download URL. The name is matched case-insensitively, by architecture.
            - name: Set lazygit asset fact
              ansible.builtin.set_fact:
                install_base_packages_lazygit_asset: >-
                  {{ resolved_github_release.assets
                     | selectattr('name', 'search', '(?i)^lazygit_[0-9.]+_linux_' ~ ('arm64' if (is_arm64 | default(false)) else 'x86_64') ~ '\.tar\.gz$')
                     | first }}

            # NOTE: Downloaded to a file first so get_url can verify GitHub's digest for the asset.
            - name: Download lazygit
              ansible.builtin.get_url:
                url: "{{ install_base_packages_lazygit_asset.browser_download_url }}"
                dest: /tmp/lazygit.tar.gz
                checksum: "{{ install_base_packages_lazygit_asset.digest }}"
                mode: "0644"

            - name: Unarchive lazygit
              ansible.builtin.unarchive:
                src: /tmp/lazygit.tar.gz
                dest: /tmp
                remote_src: true

            - name: Install lazygit
              ansible.builtin.copy:
                src: /tmp/lazygit
                dest: /usr/local/bin/lazygit
                mode: "0755"
                remote_src: true

    - name: Uninstall apt-managed fzf for Debian based systems
      become: true
      ansible.builtin.apt:
        name: fzf
        state: absent
        autoremove: true
      # NOTE: We are uninstalling the apt-managed version of fzf because it is often outdated
      #       and causes compatibility issues with fzf-lua. We will install fzf from source instead.

    - name: Install fzf from source for Debian based systems
      block:
        # NOTE: The apt package for fzf is often outdated, leading to compatibility issues with fzf-lua.
        #       Installing directly from source ensures the latest version with all features.
        # NOTE: "Latest" here means the newest release older than the supply-chain cutoff (see the playbook).
        - name: Find the newest fzf release older than the supply-chain cutoff
          ansible.builtin.include_tasks: ../../../common/tasks/resolve_github_release.yml
          vars:
            resolve_github_release_repo: junegunn/fzf

        - name: Set fzf_version fact
          ansible.builtin.set_fact:
            install_base_packages_fzf_version: "{{ resolved_github_release.tag_name }}"

        # NOTE: The clone is only ever created fresh, never updated in place. ansible-core 2.22's `git`
        #       module crashes (`'NoneType' object has no attribute 'startswith'`, in get_head_branch)
        #       when it fetches into an existing `depth: 1` clone with a detached HEAD (a checked-out
        #       tag), because such a clone has no `refs/remotes/origin/HEAD`. So every run after the
        #       first failed. Found and verified in WSL2 Ubuntu (Nov 2026). An outdated clone is
        #       replaced, which also re-runs fzf's installer for the new version.
        - name: Check which fzf release is cloned
          ansible.builtin.command:
            argv: [git, -C, "{{ ansible_facts.env.HOME }}/.fzf", describe, --tags, --exact-match]
          register: install_base_packages_fzf_cloned_tag
          changed_when: false
          failed_when: false

        - name: Set whether fzf needs (re)installing
          ansible.builtin.set_fact:
            install_base_packages_fzf_needs_install: "{{ install_base_packages_fzf_cloned_tag.stdout | trim != install_base_packages_fzf_version }}"

        - name: Remove an outdated fzf clone
          when: install_base_packages_fzf_needs_install
          ansible.builtin.file:
            path: "{{ ansible_facts.env.HOME }}/.fzf"
            state: absent

        - name: Clone fzf repository
          when: install_base_packages_fzf_needs_install
          ansible.builtin.git: # noqa: latest[git]
            repo: "https://github.com/junegunn/fzf.git"
            dest: "{{ ansible_facts.env.HOME }}/.fzf"
            version: "{{ install_base_packages_fzf_version }}"
            depth: 1

        - name: Check if the fzf binary is installed
          ansible.builtin.stat:
            path: "{{ ansible_facts.env.HOME }}/.fzf/bin/fzf"
          register: install_base_packages_fzf_binary_stat

        - name: Run fzf install script
          when: not install_base_packages_fzf_binary_stat.stat.exists
          ansible.builtin.command: "{{ ansible_facts.env.HOME }}/.fzf/install --all"
          changed_when: true

    - name: Install Starship
      block:
        - name: Check if starship is installed
          ansible.builtin.command: which starship
          register: install_base_packages_starship_check
          failed_when: false
          changed_when: false

        # NOTE: The installer would fetch the newest release; `--version` gives it the newest one older than
        #       the supply-chain cutoff instead (see the playbook).
        - name: Find the newest Starship release older than the supply-chain cutoff
          when: install_base_packages_starship_check.rc != 0
          ansible.builtin.include_tasks: ../../../common/tasks/resolve_github_release.yml
          vars:
            resolve_github_release_repo: starship/starship

        - name: Download Starship install script
          when: install_base_packages_starship_check.rc != 0
          ansible.builtin.get_url:
            url: https://starship.rs/install.sh
            dest: "/tmp/install_starship_{{ ansible_facts.user_id }}.sh"
            mode: "0755"

        - name: Run Starship install script
          when: install_base_packages_starship_check.rc != 0
          become: true
          ansible.builtin.command:
            argv:
              - "/tmp/install_starship_{{ ansible_facts.user_id }}.sh"
              - -y
              - --version
              - "{{ resolved_github_release.tag_name }}"
          changed_when: true

    - name: Install nvm, node and pnpm
      block:
        # NOTE: Pinned to a release, and checked against a checksum kept in this repo, because tags can be moved.
        # NOTE: Node.js itself is not age-gated: `nvm install --lts` takes the current LTS release from
        #       nodejs.org and checks it against nodejs.org's SHASUMS256.txt.
        - name: Download nvm install script
          ansible.builtin.get_url:
            url: https://raw.githubusercontent.com/nvm-sh/nvm/v0.39.7/install.sh
            dest: "/tmp/install_nvm_{{ ansible_facts.user_id }}.sh"
            checksum: sha256:8e45fa547f428e9196a5613efad3bfa4d4608b74ca870f930090598f5af5f643
            mode: "0755"

        - name: Run nvm install script
          ansible.builtin.command: "/tmp/install_nvm_{{ ansible_facts.user_id }}.sh"
          args:
            creates: "{{ ansible_facts.env.HOME }}/.nvm/nvm.sh"

        - name: Install Node.js LTS
          ansible.builtin.shell: >
            set -o pipefail && source {{ ansible_facts.env.HOME }}/.nvm/nvm.sh && nvm install --lts
          args:
            executable: /bin/bash
            creates: "{{ ansible_facts.env.HOME }}/.nvm/versions/node"

        - name: Find NVM Node bin directory
          ansible.builtin.shell: |
            find {{ ansible_facts.env.HOME }}/.nvm/versions/node -maxdepth 2 -type d -name "bin" 2>/dev/null | head -n 1
          register: install_base_packages_nvm_node_bin_raw
          changed_when: false

        - name: Set NVM Node bin fact
          ansible.builtin.set_fact:
            install_base_packages_node_bin_dir: "{{ install_base_packages_nvm_node_bin_raw.stdout | trim }}"

        # NOTE: The pnpm executable is resolved rather than hard-coded, because its location depends
        #       on the pnpm version (see common/tasks/resolve_pnpm_executable.yml).
        - name: Find an existing pnpm
          ansible.builtin.include_tasks: ../../../common/tasks/resolve_pnpm_executable.yml
          vars:
            resolve_pnpm_node_bin_dir: "{{ install_base_packages_node_bin_dir }}"

        - name: Record whether pnpm was already installed
          ansible.builtin.set_fact:
            install_base_packages_pnpm_preinstalled: "{{ resolved_pnpm_executable_path | length > 0 }}"

        - name: Ensure pnpm home directory exists
          ansible.builtin.file:
            path: "{{ ansible_facts.env.HOME }}/.local/share/pnpm"
            state: directory
            mode: "0755"

        # NOTE: pnpm's installer would install the newest pnpm. `npm pack --dry-run` resolves the version that
        #       npm's release-age gate allows (npm_config_min_release_age, set by the playbook) without
        #       downloading or running anything, and PNPM_VERSION passes it to the installer. Verified in
        #       WSL2 Ubuntu (Nov 2026): 12.22.0 instead of the 4-day-old 12.23.0. The installer itself checks
        #       npm's registry signature and the tarball's integrity.
        - name: Resolve the pnpm version to install
          when: not install_base_packages_pnpm_preinstalled
          ansible.builtin.shell: >
            set -o pipefail &&
            source {{ ansible_facts.env.HOME }}/.nvm/nvm.sh &&
            npm pack pnpm@latest --dry-run --json --ignore-scripts
          args:
            executable: /bin/bash
            chdir: /tmp
          register: install_base_packages_pnpm_pack
          changed_when: false

        - name: Download pnpm install script
          when: not install_base_packages_pnpm_preinstalled
          ansible.builtin.get_url:
            url: https://get.pnpm.io/install.sh
            dest: "/tmp/install_pnpm_{{ ansible_facts.user_id }}.sh"
            mode: "0755"

        - name: Run pnpm install script
          when: not install_base_packages_pnpm_preinstalled
          ansible.builtin.shell: >
            set -o pipefail &&
            export PNPM_HOME="{{ ansible_facts.env.HOME }}/.local/share/pnpm" &&
            export SHELL="/bin/bash" &&
            export PATH="$PNPM_HOME/bin:$PNPM_HOME:$PATH" &&
            bash /tmp/install_pnpm_{{ ansible_facts.user_id }}.sh
          environment:
            PNPM_VERSION: "{{ (install_base_packages_pnpm_pack.stdout | from_json | first).version }}"
          args:
            executable: /bin/bash
          changed_when: true
          failed_when: false

        # NOTE: `pnpm self-update` honours pnpm_config_minimum_release_age (set by the playbook). Verified in
        #       WSL2 Ubuntu (Nov 2026): from 12.21.0 it updated to 12.22.0, skipping the 4-day-old 12.23.0.
        #       It doesn't downgrade a newer pnpm that is already installed.
        - name: Update pnpm
          when: install_base_packages_pnpm_preinstalled
          ansible.builtin.command:
            cmd: "{{ resolved_pnpm_executable_path }} self-update"
            chdir: "{{ ansible_facts.env.HOME }}"
          environment:
            PNPM_HOME: "{{ ansible_facts.env.HOME }}/.local/share/pnpm"
          changed_when: false

        - name: Find pnpm after installing or updating it
          ansible.builtin.include_tasks: ../../../common/tasks/resolve_pnpm_executable.yml
          vars:
            resolve_pnpm_node_bin_dir: "{{ install_base_packages_node_bin_dir }}"

        # NOTE: If the standalone installer failed, fall back to npm from Node LTS (installed via nvm
        #       above) to ensure pnpm is present.
        # NOTE: npm 11.20+ skips install scripts that are not explicitly allowed, and pnpm uses them to set
        #       itself up, hence --allow-scripts=pnpm (older npm versions ignore the unknown flag). This was
        #       found and verified on Windows; it is applied here by analogy.
        - name: Install pnpm via npm fallback if needed
          when: resolved_pnpm_executable_path | length == 0
          ansible.builtin.shell: >
            set -o pipefail &&
            source {{ ansible_facts.env.HOME }}/.nvm/nvm.sh &&
            npm install -g --allow-scripts=pnpm pnpm &&
            export PNPM_HOME="{{ ansible_facts.env.HOME }}/.local/share/pnpm" &&
            export SHELL="/bin/bash" &&
            pnpm setup --force || cp "$(which pnpm)" "{{ ansible_facts.env.HOME }}/.local/share/pnpm/pnpm"
          args:
            executable: /bin/bash
          changed_when: true

        - name: Find pnpm after the npm fallback
          when: resolved_pnpm_executable_path | length == 0
          ansible.builtin.include_tasks: ../../../common/tasks/resolve_pnpm_executable.yml
          vars:
            resolve_pnpm_node_bin_dir: "{{ install_base_packages_node_bin_dir }}"

        - name: Fail if no working pnpm was found
          ansible.builtin.assert:
            that: resolved_pnpm_executable_path | length > 0
            fail_msg: >-
              No working pnpm found in ~/.local/share/pnpm/bin, ~/.local/share/pnpm or on PATH after
              running the installer and the npm fallback.
            quiet: true

        - name: Set pnpm executable fact
          ansible.builtin.set_fact:
            install_base_packages_pnpm_executable_path: "{{ resolved_pnpm_executable_path }}"

    - name: Install pnpm packages
      ansible.builtin.include_tasks: ../../../common/tasks/install_pnpm_global_packages.yml
      vars:
        pnpm_global_executable: "{{ install_base_packages_pnpm_executable_path }}"
        pnpm_global_environment:
          PNPM_HOME: "{{ ansible_facts.env.HOME }}/.local/share/pnpm"
          PATH: "{{ ansible_facts.env.HOME }}/.local/share/pnpm/bin:{{ ansible_facts.env.HOME }}/.local/share/pnpm:{{ install_base_packages_node_bin_dir | default('') }}:{{ ansible_facts.env.PATH }}"
        pnpm_global_packages: "{{ install_base_packages_pnpm_global_packages }}"

    - name: Ensure pipx binary directory is in PATH
      ansible.builtin.command:
        cmd: /usr/bin/pipx ensurepath
      changed_when: false

    - name: Install pipx packages
      ansible.builtin.command:
        cmd: /usr/bin/pipx install {{ item }}
      environment:
        PATH: "{{ ansible_facts.env.HOME }}/.local/bin:{{ ansible_facts.env.PATH }}"
      with_items:
        - ansible-lint
        - pynvim
      changed_when: false
